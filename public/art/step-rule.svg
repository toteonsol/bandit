  <rect x="18.5" y="24.5" width="163" height="113" rx="15.5" stroke="#EAEEDA" stroke-opacity=".12"/>
  <!-- label lines -->
  <rect x="34" y="42" width="64" height="8" rx="4" fill="#EAEEDA" opacity=".6"/>
  <rect x="34" y="56" width="40" height="6" rx="3" fill="#EAEEDA" opacity=".22"/>
