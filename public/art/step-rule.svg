  <path d="M78.5 74.5H89.5C90.6 74.5 91.2 75.8 90.5 76.6L85.1 82.2C84.5 82.8 83.5 82.8 82.9 82.2L77.5 76.6C76.8 75.8 77.4 74.5 78.5 74.5Z" fill="#C8F25A"/>
  <circle cx="62" cy="102" r="15" fill="url(#step-rule-glow)"/>
  <circle cx="62" cy="102" r="7" fill="#C8F25A" stroke="#0A0B08" stroke-width="2.5"/>
