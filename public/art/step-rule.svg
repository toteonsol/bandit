<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="step-rule-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20251A"/>
      <stop offset="1" stop-color="#171A12"/>
    </linearGradient>
    <radialGradient id="step-rule-glow">
      <stop offset="0" stop-color="#C8F25A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#C8F25A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- card -->
  <rect x="18" y="24" width="164" height="114" rx="16" fill="#0A0B08" opacity=".45" transform="translate(0 4)"/>
